<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz</title>
</head>
<body>
    <h1>Welcome to the Quiz!</h1>
    <p>Test your knowledge about Dinosaurs!</p>
    <form>
        <h2>1. What does Dinosaur mean?</h2>
       <label><input type="radio" name="q1" value="a" > A) Giant reptile</label><br>
       <label><input type="radio" name="q1" value="b" > B) Ancient beast</label><br>
       <label><input type="radio" name="q1" value="c" > C) Terrible lizard</label><br>
       <label><input type="radio" name="q1" value="d" > D) Prehistoric lizard</label><br>

        <h2>2. What period did Dinosaurs first appear?</h2>
       <label><input type="radio" name="q2" value="a" > A) Cretaceous</label><br>
       <label><input type="radio" name="q2" value="b" > B) Triassic</label><br>
       <label><input type="radio" name="q2" value="c" > C) Jurassic</label><br>

       <h2>3. Which dinosaur is known as the “king of dinosaurs”?</h2>
       <label><input type="radio" name="q3" value="a" > A) Gigasaurus</label><br>
       <label><input type="radio" name="q3" value="b" > B) Tarbosaurus</label><br>
       <label><input type="radio" name="q3" value="c" > C) Tyrannosaurus</label><br>

       <button type="submit">Submit Quiz</button><br>
    </form>
</body>
</html>
